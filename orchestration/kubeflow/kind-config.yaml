# kind (Kubernetes-in-Docker) cluster config for running the ClinOps KFP pipeline locally.
# Create with: kind create cluster --config kind-config.yaml
# Skeleton — adjust node count / port mappings as needed for your Kubeflow install.

kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: clinops
nodes:
  - role: control-plane
    extraPortMappings:
      # Expose the KFP / ml-pipeline UI locally.
      - containerPort: 30080
        hostPort: 8090
        protocol: TCP
